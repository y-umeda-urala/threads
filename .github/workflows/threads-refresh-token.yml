name: Threads トークン更新

# 長期アクセストークンの有効期限は 60 日。週 1 回更新して切らさないようにする。
# 更新後のトークンを Secret へ書き戻すには、Secrets への書き込み権限を持つ
# Personal Access Token を Secret GH_PAT に登録しておく必要がある。
on:
  # 毎週月曜 12:00 JST
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: トークンを更新する
        id: refresh
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          response="$(python -m threads_bot refresh-token | tail -n 1)"
          token="$(printf '%s' "$response" | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: 新しいトークンを Secret に書き戻す
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.refresh.outputs.token }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::GH_PAT が未設定です。THREADS_ACCESS_TOKEN を手動で更新してください。"
            exit 0
          fi
          gh secret set THREADS_ACCESS_TOKEN --repo "${GITHUB_REPOSITORY}" --body "${NEW_TOKEN}"
